# Stellt die App bei jeder Änderung auf main automatisch online (Website, Datenbank-Regeln, Backend).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manuell starten: Actions → Deploy → Run workflow

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Einrichtung prüfen
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if grep -q 'DEIN-PROJEKT' .firebaserc || grep -q 'DEIN_API_KEY' public/firebase-config.js; then
            echo "::warning::.firebaserc oder public/firebase-config.js enthält noch Platzhalter – nichts veröffentlicht."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SA" ]; then
            echo "::warning::GitHub-Secret FIREBASE_SERVICE_ACCOUNT fehlt (README Schritt 7) – nichts veröffentlicht."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Backend installieren und testen
        if: steps.check.outputs.ready == 'true'
        working-directory: functions
        run: |
          set -o pipefail
          { npm ci && npm test; } 2>&1 | tee ../step.log

      - name: Bei Google anmelden
        if: steps.check.outputs.ready == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Veröffentlichen
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          npx -y firebase-tools@15 deploy --non-interactive --force 2>&1 | tee step.log

      # Bei einem Fehler die wichtigsten Zeilen als Meldung anzeigen (oben in der Zusammenfassung sichtbar)
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          [ -f step.log ] || exit 0
          grep -iE "error|denied|permission|not enabled|failed|missing|billing|blaze|403|401" step.log \
            | grep -viE "^\s*$|deprecat" | tail -n 12 | cut -c1-900 \
            | while IFS= read -r line; do echo "::error::$line"; done
          tail -n 6 step.log | cut -c1-900 | while IFS= read -r line; do echo "::warning::$line"; done
